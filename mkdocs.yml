site_name: Semantic Workspace
site_description: Map unstructured documents, forms and recorded calls onto a given semantic layer.
site_url: https://ferdinandzhong.github.io/unstructured-semantic-workspace/
repo_url: https://github.com/FerdinandZhong/unstructured-semantic-workspace
repo_name: unstructured-semantic-workspace
edit_uri: ""
docs_dir: docs

# The paper sources (docs/paper/) and the app's static files (docs/design/) sit under docs/ in the published
# repository. They are not pages.
exclude_docs: |
  paper/
  design/

theme:
  name: material
  language: en
  logo: assets/images/logo-cloudera-white.svg
  favicon: assets/images/favicon.ico
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search:
      lang:
        - en
        - zh
  # One site, two languages. A page is `name.md` (English) or `name.zh.md` (Chinese).
  # The language button in the header switches the same page; Chinese is served under /zh/.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          site_name: 语义工作区
          site_description: 把非结构化文档、表单和通话录音映射到给定的语义层。
          nav_translations:
            Home: 首页
            Design: 设计
            Concepts: 概念
            Architecture: 架构
            Ingestion: 摄取
            "Pipeline A: evidence links": "管线 A：证据链接"
            "Pipeline B: concept catalog": "管线 B：概念目录"
            Review and release: 审核与发布
            Use: 使用
            Ask: 提问
            Table rows: 表行
            Access and masking: 访问与掩码
            Localization: 本地化
            Results: 结果
            Evaluation: 评估
            Data: 数据
            Deploy: 部署
            Deployment: 部署

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Design:
      - Concepts: concepts.md
      - Architecture: architecture.md
      - Ingestion: ingestion.md
      - "Pipeline A: evidence links": pipeline-a.md
      - "Pipeline B: concept catalog": pipeline-b.md
      - Review and release: review-and-release.md
  - Use:
      - Ask: ask.md
      - "Table rows": output-c.md
      - Access and masking: access-and-masking.md
      - Localization: localization.md
  - Results:
      - Evaluation: evaluation.md
      - Data: data.md
  - Deploy:
      - Deployment: deployment.md
