    ai_context:
      synonyms:
      - WO
      - work order number
      - production order
  - name: ProductID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ProductID
    label: Product ID
    description: Product that the operation builds. It always equals the product of the work order in
      this data.
    datatype: Integer
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"concept": "product_identifier", "normalized_type": "int", "review_state": "authored_demo_candidate",
