      dialects:
      - dialect: ANSI_SQL
        expression: AccountNumber
    label: Customer account number
    description: Customer number assigned by the accounting system. The source computes it as AW followed
      by the zero-padded customer ID.
    datatype: String
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"concept": "customer_identifier", "normalized_type": "nvarchar", "review_state": "authored_demo_candidate",
        "role": "identifier", "source_column": "AccountNumber", "source_description": "Unique number identifying
        the customer assigned by the accounting system.", "source_table": "Sales.Customer", "source_type":
        "nvarchar"}'
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - customer number
      - account no.
      - customer account
      - customer code
  - name: rowguid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: rowguid
    label: Row GUID
    description: Technical row identifier used by the source database for a replication sample. It has
      no business meaning. Do not use it to match documents or records.
    datatype: String
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"normalized_type": "uniqueidentifier", "review_state": "authored_demo_candidate", "role":
        "audit", "source_column": "rowguid", "source_description": "ROWGUIDCOL number uniquely identifying
        the record. Used to support a merge replication sample.", "source_table": "Sales.Customer", "source_type":
        "uniqueidentifier"}'
    dimension:
      is_time: false
  - name: ModifiedDate
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ModifiedDate
    label: Last modified
    description: Date and time the row was last updated in the source system. It is a system audit timestamp,
      not a business event date. It can fall outside the transaction period.
    datatype: DateTime
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"normalized_type": "datetime", "review_state": "authored_demo_candidate", "role": "audit",
        "source_column": "ModifiedDate", "source_description": "Date and time the record was last updated.",
        "source_table": "Sales.Customer", "source_type": "datetime"}'
    dimension:
      is_time: true
  custom_extensions:
  - vendor_name: HELIOS
    data: '{"kind": "dimension", "label": "Customer account", "source_table": "Sales.Customer", "subject_area":
      "sales_orders"}'
  ai_context:
    synonyms:
    - customer
    - account
    - buyer
    - client
    - sold-to party
- name: Production_Document
  source: Production_Document
  primary_key:
  - DocumentNode
  description: Product maintenance, service and assembly documents, arranged as a folder tree. One row
    per folder or document. This data has 4 folder entries and 8 Word documents.
  fields:
  - name: DocumentNode
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: DocumentNode
    label: Document node
    description: Key of one document or folder. It is a position in the document tree stored as an opaque
      hierarchy value, not a readable path.
    datatype: Opaque
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"concept": "product_document", "normalized_type": "hierarchyid", "review_state": "authored_demo_candidate",
        "role": "identifier", "source_column": "DocumentNode", "source_description": "Primary key for
        Document records.", "source_table": "Production.Document", "source_type": "hierarchyid"}'
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - document ID
      - document key
  - name: DocumentLevel
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: DocumentLevel
    label: Document tree level
    description: Depth of the entry in the document tree, computed by the source from the document node.
      In this data 0 is the root, 1 is a folder and 2 is a document.
    datatype: Integer
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"normalized_type": "int", "review_state": "authored_demo_candidate", "role": "attribute",
        "source_column": "DocumentLevel", "source_description": "Depth in the document hierarchy.", "source_table":
        "Production.Document", "source_type": "int"}'
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - folder depth
      - hierarchy level
  - name: Title
    expression:
      dialects:
