      - product built
  - name: OperationSequence
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: OperationSequence
    label: Operation sequence
    description: Position of the operation in the manufacturing sequence of the work order. Values 1 to
      7 occur. In this data each sequence number always runs at the same location.
    datatype: Integer
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"concept": "routing_operation", "normalized_type": "smallint", "review_state": "authored_demo_candidate",
        "role": "identifier", "source_column": "OperationSequence", "source_description": "", "source_table":
        "Production.WorkOrderRouting", "source_type": "smallint"}'
    dimension:
