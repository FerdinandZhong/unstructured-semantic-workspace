    unit price, discount and line total. Order, due and ship dates and the customer are on the sales order.
    The model declares a derived join from ProductID to the product table. The source schema links order
    lines to products only through SpecialOfferProduct, which is outside the 25-table projection, so the
    join is derived from two source foreign keys.
