version: 0.2.0.dev0
name: adventureworks_manufacturing_demo
description: Authored demonstration semantic model from pinned Microsoft AdventureWorks metadata. This
  is not Helios AI-generated or human-certified.
ai_context:
  instructions: Use source namespace and verified keys for identity. Separate obligations, observations
    and SQL facts. Do not use unresolved metadata conflicts as certified definitions. SQL dialect portability
    beyond the local preparation fixture is unverified.
datasets:
- name: Person_Address
  source: Person_Address
  primary_key:
  - AddressID
  description: Street addresses of customers, employees and vendors. One row per address. Sales orders
    point here for the bill-to and the ship-to address.
  fields:
  - name: AddressID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AddressID
    label: Address ID
    description: Unique key of one postal address. Sales orders reference it as the bill-to and the ship-to
      address.
    datatype: Integer
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"concept": "postal_address", "normalized_type": "int", "review_state": "authored_demo_candidate",
        "role": "identifier", "source_column": "AddressID", "source_description": "Primary key for Address
        records.", "source_table": "Person.Address", "source_type": "int"}'
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - address number
      - address key
  - name: AddressLine1
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AddressLine1
    label: Street address line 1
    description: First line of the street address, usually the street and building number.
    datatype: String
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"normalized_type": "nvarchar(60)", "review_state": "authored_demo_candidate", "role": "attribute",
        "source_column": "AddressLine1", "source_description": "First street address line.", "source_table":
        "Person.Address", "source_type": "nvarchar(60)"}'
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - street address
      - address line 1
      - street
  - name: AddressLine2
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AddressLine2
    label: Street address line 2
    description: Second line of the street address, such as a suite, unit or building. Empty for most
      addresses.
    datatype: String
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"normalized_type": "nvarchar(60)", "review_state": "authored_demo_candidate", "role": "attribute",
        "source_column": "AddressLine2", "source_description": "Second street address line.", "source_table":
        "Person.Address", "source_type": "nvarchar(60)"}'
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - address line 2
      - suite
      - unit
      - building
  - name: City
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: City
    label: City
    description: Name of the city of the address. Use it to group orders by ship-to or bill-to city.
    datatype: String
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"normalized_type": "nvarchar(30)", "review_state": "authored_demo_candidate", "role": "dimension",
        "source_column": "City", "source_description": "Name of the city.", "source_table": "Person.Address",
        "source_type": "nvarchar(30)"}'
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - town
      - delivery city
      - ship-to city
  - name: StateProvinceID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: StateProvinceID
    label: State or province ID
    description: Key of the state or province of the address. The state and province lookup is not included
      in this pack, so only the numeric key is available.
    datatype: Integer
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"normalized_type": "int", "review_state": "authored_demo_candidate", "role": "identifier",
        "source_column": "StateProvinceID", "source_description": "Unique identification number for the
        state or province. Foreign key to StateProvince table.", "source_table": "Person.Address", "source_type":
        "int"}'
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - state
      - province
      - region
  - name: PostalCode
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: PostalCode
    label: Postal code
    description: Postal code of the street address, stored as text.
    datatype: String
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"normalized_type": "nvarchar(15)", "review_state": "authored_demo_candidate", "role": "attribute",
        "source_column": "PostalCode", "source_description": "Postal code for the street address.", "source_table":
        "Person.Address", "source_type": "nvarchar(15)"}'
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - zip code
      - postcode
      - ZIP
  - name: SpatialLocation
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SpatialLocation
    label: Geographic coordinates
    description: Latitude and longitude of the address, stored as an opaque geography value. This pack
      cannot run spatial queries on it.
    datatype: Opaque
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"normalized_type": "geography", "review_state": "authored_demo_candidate", "role": "attribute",
        "source_column": "SpatialLocation", "source_description": "Latitude and longitude of this address.",
        "source_table": "Person.Address", "source_type": "geography"}'
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - geo-location
      - coordinates
      - latitude and longitude
  - name: rowguid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: rowguid
    label: Row GUID
    description: Technical row identifier used by the source database for a replication sample. It has
      no business meaning. Do not use it to match documents or records.
    datatype: String
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"normalized_type": "uniqueidentifier", "review_state": "authored_demo_candidate", "role":
        "audit", "source_column": "rowguid", "source_description": "ROWGUIDCOL number uniquely identifying
        the record. Used to support a merge replication sample.", "source_table": "Person.Address", "source_type":
        "uniqueidentifier"}'
    dimension:
      is_time: false
  - name: ModifiedDate
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ModifiedDate
    label: Last modified
    description: Date and time the row was last updated in the source system. It is a system audit timestamp,
      not a business event date. It can fall outside the transaction period.
    datatype: DateTime
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"normalized_type": "datetime", "review_state": "authored_demo_candidate", "role": "audit",
        "source_column": "ModifiedDate", "source_description": "Date and time the record was last updated.",
        "source_table": "Person.Address", "source_type": "datetime"}'
    dimension:
      is_time: true
  custom_extensions:
  - vendor_name: HELIOS
    data: '{"kind": "dimension", "label": "Postal address", "source_table": "Person.Address", "subject_area":
      "parties"}'
  ai_context:
    synonyms:
    - address
    - delivery address
    - ship-to address
    - bill-to address
    - site address
- name: Production_BillOfMaterials
  source: Production_BillOfMaterials
  primary_key:
  - BillOfMaterialsID
  description: Components required to make bicycles and subassemblies. One row per parent assembly, component
    and start date. It gives the parent-to-component hierarchy and the quantity of each component per
    assembly. Top-level rows have no parent assembly.
  fields:
  - name: BillOfMaterialsID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: BillOfMaterialsID
    label: BOM line ID
    description: Unique key of one bill-of-materials row, that is one component of one parent assembly
      for one period.
    datatype: Integer
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"concept": "bill_of_materials", "normalized_type": "int", "review_state": "authored_demo_candidate",
        "role": "identifier", "source_column": "BillOfMaterialsID", "source_description": "Primary key
        for BillOfMaterials records.", "source_table": "Production.BillOfMaterials", "source_type": "int"}'
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - BOM ID
      - BOM line
      - structure line
  - name: ProductAssemblyID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ProductAssemblyID
    label: Parent assembly product ID
    description: Product that is built from the component, the parent assembly. Empty on the 103 top-level
      rows, which are exactly the rows at BOM level 0.
    datatype: Integer
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"concept": "product_identifier", "normalized_type": "int", "review_state": "authored_demo_candidate",
        "role": "identifier", "source_column": "ProductAssemblyID", "source_description": "Parent product
        identification number. Foreign key to Product.ProductID.", "source_table": "Production.BillOfMaterials",
        "source_type": "int"}'
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - parent item
      - assembly
      - parent product
      - parent part
  - name: ComponentID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ComponentID
    label: Component product ID
    description: Product that is consumed as a component of the parent assembly.
    datatype: Integer
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"concept": "product_identifier", "normalized_type": "int", "review_state": "authored_demo_candidate",
        "role": "identifier", "source_column": "ComponentID", "source_description": "Component identification
        number. Foreign key to Product.ProductID.", "source_table": "Production.BillOfMaterials", "source_type":
        "int"}'
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - component
      - child item
      - part
      - material
      - sub-component
  - name: StartDate
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: StartDate
    label: Component effective from
    description: Date the component started being used in the assembly.
    datatype: DateTime
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"normalized_type": "datetime", "review_state": "authored_demo_candidate", "role": "time",
        "source_column": "StartDate", "source_description": "Date the component started being used in
        the assembly item.", "source_table": "Production.BillOfMaterials", "source_type": "datetime"}'
    dimension:
      is_time: true
    ai_context:
      synonyms:
      - effective from
      - valid from
      - effectivity start
  - name: EndDate
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: EndDate
    label: Component effective to
    description: Date the component stopped being used in the assembly. Empty while the component is still
      in use.
    datatype: DateTime
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"normalized_type": "datetime", "review_state": "authored_demo_candidate", "role": "time",
        "source_column": "EndDate", "source_description": "Date the component stopped being used in the
        assembly item.", "source_table": "Production.BillOfMaterials", "source_type": "datetime"}'
    dimension:
      is_time: true
    ai_context:
      synonyms:
      - effective to
      - valid to
      - effectivity end
      - obsolete from
  - name: UnitMeasureCode
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: UnitMeasureCode
    label: Component unit of measure
    description: Unit of measure of the per-assembly quantity. Three codes occur here. Names come from
      the unit of measure lookup. Codes are padded to three characters.
    datatype: String
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"concept": "unit_of_measure", "normalized_type": "nchar(3)", "review_state": "authored_demo_candidate",
        "role": "dimension", "source_column": "UnitMeasureCode", "source_description": "Standard code
        identifying the unit of measure for the quantity.", "source_table": "Production.BillOfMaterials",
        "source_type": "nchar(3)", "values": {"EA": "Each", "IN": "Inch", "OZ": "Ounces"}}'
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - UoM
      - unit
      - component unit
  - name: BOMLevel
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: BOMLevel
    label: BOM level
    description: Depth of the component below the top of the product structure, as described by the source.
      Levels 0 to 4 occur. Level 0 rows have no parent assembly.
    datatype: Integer
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"normalized_type": "smallint", "review_state": "authored_demo_candidate", "role": "dimension",
        "source_column": "BOMLevel", "source_description": "Indicates the depth the component is from
        its parent (AssemblyID).", "source_table": "Production.BillOfMaterials", "source_type": "smallint"}'
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - level
      - structure level
      - indenture level
      - depth
  - name: PerAssemblyQty
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: PerAssemblyQty
    label: Component quantity per assembly
    description: Quantity of the component needed to create one parent assembly, in the component unit
      of measure and for the effective period. Values range from 1 to 41. It is a design quantity, not
      a quantity ordered, issued or consumed.
    datatype: Decimal
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"concept": "component_quantity", "normalized_type": "decimal(8, 2)", "review_state": "authored_demo_candidate",
        "role": "measure", "source_column": "PerAssemblyQty", "source_description": "Quantity of the component
        needed to create the assembly.", "source_table": "Production.BillOfMaterials", "source_type":
        "decimal(8, 2)", "unit": "component unit of measure per assembly (see UnitMeasureCode)"}'
    ai_context:
      synonyms:
      - quantity per
      - usage quantity
      - qty per assembly
      - component quantity
      - quantity required
      examples:
      - How many of each component does one unit of this assembly need?
  - name: ModifiedDate
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ModifiedDate
    label: Last modified
    description: Date and time the row was last updated in the source system. It is a system audit timestamp,
      not a business event date. It can fall outside the transaction period.
    datatype: DateTime
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"normalized_type": "datetime", "review_state": "authored_demo_candidate", "role": "audit",
        "source_column": "ModifiedDate", "source_description": "Date and time the record was last updated.",
        "source_table": "Production.BillOfMaterials", "source_type": "datetime"}'
    dimension:
      is_time: true
  custom_extensions:
  - vendor_name: HELIOS
    data: '{"kind": "dimension", "label": "Bill of materials", "source_table": "Production.BillOfMaterials",
      "subject_area": "product_catalog"}'
  ai_context:
    synonyms:
    - BOM
    - product structure
    - parts list
    - components list
    - material list
- name: Person_BusinessEntity
  source: Person_BusinessEntity
  primary_key:
  - BusinessEntityID
  description: Source of the shared key that connects vendors, stores and persons with address and contact
    information. One row per party. It holds no business attributes of its own.
  fields:
  - name: BusinessEntityID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: BusinessEntityID
    label: Business entity ID
    description: Shared party key. Vendors, stores and persons take their key from here, so the same number
      identifies the same party in each of those tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"normalized_type": "int", "review_state": "authored_demo_candidate", "role": "identifier",
        "source_column": "BusinessEntityID", "source_description": "Primary key for all customers, vendors,
        and employees.", "source_table": "Person.BusinessEntity", "source_type": "int"}'
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - party ID
      - business partner ID
  - name: rowguid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: rowguid
    label: Row GUID
    description: Technical row identifier used by the source database for a replication sample. It has
      no business meaning. Do not use it to match documents or records.
    datatype: String
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"normalized_type": "uniqueidentifier", "review_state": "authored_demo_candidate", "role":
        "audit", "source_column": "rowguid", "source_description": "ROWGUIDCOL number uniquely identifying
        the record. Used to support a merge replication sample.", "source_table": "Person.BusinessEntity",
        "source_type": "uniqueidentifier"}'
    dimension:
      is_time: false
  - name: ModifiedDate
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ModifiedDate
    label: Last modified
    description: Date and time the row was last updated in the source system. It is a system audit timestamp,
      not a business event date. It can fall outside the transaction period.
    datatype: DateTime
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"normalized_type": "datetime", "review_state": "authored_demo_candidate", "role": "audit",
        "source_column": "ModifiedDate", "source_description": "Date and time the record was last updated.",
        "source_table": "Person.BusinessEntity", "source_type": "datetime"}'
    dimension:
      is_time: true
  custom_extensions:
  - vendor_name: HELIOS
    data: '{"kind": "dimension", "label": "Business entity (party key)", "source_table": "Person.BusinessEntity",
      "subject_area": "parties"}'
  ai_context:
    synonyms:
    - party
    - party key
    - business partner
- name: Sales_Customer
  source: Sales_Customer
  primary_key:
  - CustomerID
  description: Customer accounts that sales orders are placed against. One row per account. An account
    is an individual person (18,484 rows), a reseller store (701 rows), or a store with a named person
    (635 rows). Names are in the person and store tables.
  fields:
  - name: CustomerID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: CustomerID
    label: Customer ID
    description: Unique key of one customer account in the AdventureWorks namespace. Sales orders reference
      it. The store ID links a business customer to its store.
    datatype: Integer
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"concept": "customer_identifier", "normalized_type": "int", "review_state": "authored_demo_candidate",
        "role": "identifier", "source_column": "CustomerID", "source_description": "Primary key.", "source_table":
        "Sales.Customer", "source_type": "int"}'
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - customer number
      - customer account
      - account ID
      - client ID
  - name: PersonID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: PersonID
    label: Person ID
    description: Key of the person on the account. This is an individual customer, or the named person
      when a store is also set. Empty when the account is a store without a named person.
    datatype: Integer
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"concept": "contact_person", "normalized_type": "int", "review_state": "authored_demo_candidate",
        "role": "identifier", "source_column": "PersonID", "source_description": "Foreign key to Person.BusinessEntityID",
        "source_table": "Sales.Customer", "source_type": "int"}'
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - contact
      - individual customer
      - contact person
  - name: StoreID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: StoreID
    label: Store ID
    description: Key of the reseller store the account belongs to. Empty for individual customers.
    datatype: Integer
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"concept": "reseller_store", "normalized_type": "int", "review_state": "authored_demo_candidate",
        "role": "identifier", "source_column": "StoreID", "source_description": "Foreign key to Store.BusinessEntityID",
        "source_table": "Sales.Customer", "source_type": "int"}'
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - reseller
      - dealer
      - store account
      - business customer
  - name: TerritoryID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: TerritoryID
    label: Sales territory ID
    description: Key of the sales territory in which the customer is located. Territories 1 to 10 occur.
      The territory lookup is not included in this pack, so territory names are not available.
    datatype: Integer
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"concept": "sales_territory", "normalized_type": "int", "review_state": "authored_demo_candidate",
        "role": "dimension", "source_column": "TerritoryID", "source_description": "ID of the territory
        in which the customer is located. Foreign key to SalesTerritory.SalesTerritoryID.", "source_table":
        "Sales.Customer", "source_type": "int"}'
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - sales region
      - sales territory
      - region
  - name: AccountNumber
