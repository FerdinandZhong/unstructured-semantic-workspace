metrics:
- name: sales_ordered_units
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(Sales_SalesOrderDetail.OrderQty)
  description: Sum of ordered units on sales-order lines. Not shipments, revenue or contract compliance.
    The order date and the customer are on the order header. The metric is computed on the line table.
    A filter on the order date or on a product attribute reaches the header or the product table through
    the declared joins from the line. A customer filter is two joins away, through the order header, and
    the compiler follows one declared join.
  datatype: Integer
  custom_extensions:
  - vendor_name: HELIOS
    data: '{"allowed_dimensions": ["ProductID"], "concept": "ordered_quantity", "dataset": "Sales_SalesOrderDetail",
      "grain": "sales-order line", "join_safety_requirement": "Preserve base grain; runtime enforcement
      not implemented", "label": "Sales ordered units", "required_filters": {}, "review_state": "authored_demo_candidate",
      "time_field": "Sales_SalesOrderHeader.OrderDate", "unit": "each"}'
  ai_context:
    synonyms:
    - units ordered
    - ordered quantity
    - order volume
    - quantity ordered
    - sales volume
    examples:
    - How many units of product 954 did customer 29641 order in 2024?
    - What is the ordered quantity by customer this year?
- name: production_requested_units
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(Production_WorkOrder.OrderQty)
  description: Sum requested units for a selected product and period using StartDate. Keep separate from
    sales quantities.
  datatype: Integer
  custom_extensions:
  - vendor_name: HELIOS
    data: '{"allowed_dimensions": ["ProductID"], "concept": "production_volume", "dataset": "Production_WorkOrder",
      "grain": "work order", "join_safety_requirement": "Preserve base grain; runtime enforcement not
      implemented", "label": "Production requested units", "required_filters": {}, "review_state": "authored_demo_candidate",
      "scope_required": ["ProductID"], "time_field": "StartDate", "unit": "each"}'
  ai_context:
    synonyms:
    - production quantity
    - quantity to build
    - planned production quantity
    - build quantity
    examples:
    - How many units were requested on work orders for this product in 2024?
- name: production_scrapped_units
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(Production_WorkOrder.ScrappedQty)
  description: Sum scrapped units for a selected product and period using StartDate. Not a defect percentage.
  datatype: Integer
  custom_extensions:
  - vendor_name: HELIOS
    data: '{"allowed_dimensions": ["ProductID"], "concept": "scrap_quality_context", "dataset": "Production_WorkOrder",
      "grain": "work order", "join_safety_requirement": "Preserve base grain; runtime enforcement not
      implemented", "label": "Production scrapped units", "required_filters": {}, "review_state": "authored_demo_candidate",
      "scope_required": ["ProductID"], "time_field": "StartDate", "unit": "each"}'
  ai_context:
    synonyms:
    - scrap quantity
    - scrapped units
    - scrap volume
    - rejects
    examples:
    - How many units were scrapped for this product in 2024?
- name: inventory_units
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(Production_ProductInventory.Quantity)
  description: Sum of inventory units for a selected product across selected locations. The source records
    no business date for inventory (ModifiedDate is an audit timestamp), so the metric takes no date filter
    and is not a stock trend.
  datatype: Integer
  custom_extensions:
  - vendor_name: HELIOS
    data: '{"allowed_dimensions": ["ProductID", "LocationID"], "concept": "inventory_position", "dataset":
      "Production_ProductInventory", "grain": "product/location", "join_safety_requirement": "Preserve
      base grain; runtime enforcement not implemented", "label": "Inventory units", "required_filters":
      {}, "review_state": "authored_demo_candidate", "scope_required": ["ProductID"], "time_field": "none
      recorded", "unit": "each"}'
  ai_context:
    synonyms:
    - stock on hand
    - on-hand quantity
    - inventory level
    - stock quantity
    - QOH
    examples:
    - How many units of this product are in stock at each location?
- name: sales_order_count
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT Sales_SalesOrderHeader.SalesOrderID)
  description: Count of distinct sales orders. Excludes duplicates across the header table. Time filter
    uses OrderDate.
  datatype: Integer
  custom_extensions:
  - vendor_name: HELIOS
    data: '{"allowed_dimensions": ["CustomerID", "TerritoryID"], "concept": "sales_order", "dataset":
      "Sales_SalesOrderHeader", "grain": "sales order", "label": "Sales order count", "required_filters":
      {}, "review_state": "authored_demo_candidate", "time_field": "OrderDate", "unit": "count"}'
  ai_context:
    synonyms:
    - number of orders
    - order count
    - orders placed
    - order volume
    examples:
    - How many sales orders did this customer place in 2024?
- name: sales_line_revenue
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(Sales_SalesOrderDetail.LineTotal)
  description: Total sales revenue across order lines, as recorded in LineTotal. Not a margin or profit
    figure. The source records no currency. The order date and the customer are on the order header. This
    metric is computed on the line table only, so a date or customer filter needs a join that the metric
    compiler does not support.
  datatype: Decimal
  custom_extensions:
  - vendor_name: HELIOS
    data: '{"allowed_dimensions": ["ProductID"], "concept": "revenue", "dataset": "Sales_SalesOrderDetail",
      "grain": "sales-order line", "label": "Sales line revenue", "required_filters": {}, "review_state":
      "authored_demo_candidate", "time_field": "Sales_SalesOrderHeader.OrderDate", "unit": "currency amount
      (currency not recorded in the source)"}'
  ai_context:
    synonyms:
    - revenue
    - sales value
    - sales amount
    - order value
    - turnover
    examples:
    - What was the sales value of this product in 2024?
    - What is revenue by sales territory?
- name: average_unit_price
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: AVG(Sales_SalesOrderDetail.UnitPrice)
  description: Average unit price across all sales order lines before discount. Not a list price. The
    source records no currency. The order date and the customer are on the order header. This metric is
    computed on the line table only, so a date or customer filter needs a join that the metric compiler
    does not support.
  datatype: Decimal
  custom_extensions:
  - vendor_name: HELIOS
    data: '{"allowed_dimensions": ["ProductID"], "concept": "unit_price", "dataset": "Sales_SalesOrderDetail",
      "grain": "sales-order line", "label": "Average sales unit price", "required_filters": {}, "review_state":
      "authored_demo_candidate", "time_field": "Sales_SalesOrderHeader.OrderDate", "unit": "currency amount
      per unit (currency not recorded in the source)"}'
  ai_context:
    synonyms:
    - average selling price
    - ASP
    - average price
    - mean unit price
    examples:
    - What was the average selling price of this product in 2024?
- name: production_scrap_rate
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: production_scrapped_units / production_requested_units
  description: Ratio of scrapped units to requested units across work orders. Use StartDate for period
    filtering. Zero denominator returns NULL. Not a contract-quality determination.
  datatype: Decimal
  custom_extensions:
  - vendor_name: HELIOS
    data: '{"allowed_dimensions": ["ProductID"], "concept": "production_scrap", "dataset": "Production_WorkOrder",
      "grain": "work order", "label": "Production scrap rate", "required_filters": {}, "review_state":
      "authored_demo_candidate", "time_field": "StartDate", "unit": "ratio"}'
  ai_context:
    synonyms:
    - scrap rate
    - scrap percentage
    - reject rate
    - scrap ratio
    examples:
    - What was the scrap rate for this product in 2024?
- name: late_dispatch_orders
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(CASE WHEN Sales_SalesOrderHeader.ShipDate > Sales_SalesOrderHeader.DueDate THEN
        1 END)
  description: Count of sales orders where the ship date is recorded after the due date. Each counted
    row is one order header. Zero in the pinned demo fixture; expression is correct for production data.
  datatype: Integer
  custom_extensions:
  - vendor_name: HELIOS
    data: '{"allowed_dimensions": ["CustomerID", "TerritoryID"], "concept": "delivery_lateness", "dataset":
      "Sales_SalesOrderHeader", "grain": "sales order", "label": "Late dispatch orders", "required_filters":
      {}, "review_state": "authored_demo_candidate", "time_field": "OrderDate", "unit": "count"}'
  ai_context:
    synonyms:
    - late shipments
    - orders shipped late
    - overdue shipments
    - shipped after due date
    examples:
    - How many orders shipped after their due date for this customer?
- name: open_work_orders
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(CASE WHEN Production_WorkOrder.EndDate IS NULL THEN 1 END)
  description: Count of work orders with no recorded completion date. Zero in the pinned demo fixture;
    expression is correct for live production data.
  datatype: Integer
  custom_extensions:
  - vendor_name: HELIOS
    data: '{"allowed_dimensions": ["ProductID"], "concept": "work_order_status", "dataset": "Production_WorkOrder",
      "grain": "work order", "label": "Open work orders", "required_filters": {}, "review_state": "authored_demo_candidate",
      "time_field": "StartDate", "unit": "count"}'
  ai_context:
    synonyms:
    - work in progress orders
    - WIP orders
    - unfinished work orders
    - outstanding work orders
    examples:
    - How many work orders are still open for this product?
