  description: Manufacturing operations of a work order. One row per work order, product and operation
    sequence. It holds the work centre, scheduled and actual dates, actual hours and planned and actual
    cost. 42,625 of the work orders have routing rows. The pinned source has no column comments for this
    table. Meanings follow column names, keys and data, and need domain review.
  fields:
  - name: WorkOrderID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: WorkOrderID
