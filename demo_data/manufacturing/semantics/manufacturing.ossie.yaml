    custom_extensions:
    - vendor_name: HELIOS
      data: '{"concept": "sales_order", "normalized_type": "int", "review_state": "authored_demo_candidate",
        "role": "identifier", "source_column": "SalesOrderID", "source_description": "Primary key. Foreign
        key to SalesOrderHeader.SalesOrderID.", "source_table": "Sales.SalesOrderDetail", "source_type":
        "int"}'
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - SO
      - order number
      - order ID
  - name: SalesOrderDetailID
    expression:
      dialects:
      - dialect: ANSI_SQL
