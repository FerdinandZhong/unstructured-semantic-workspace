# Relationships the source schema implies but the 25-table projection cannot declare directly.
relationships:
  - name: FK_SalesOrderDetail_Product_ProductID_derived
    from: Sales_SalesOrderDetail
    to: Production_Product
    from_columns: [ProductID]
    to_columns: [ProductID]
    derived: true
    justification: >-
      Two source foreign keys imply it. The sales order line references SpecialOfferProduct on
      (SpecialOfferID, ProductID), and SpecialOfferProduct.ProductID references Product.ProductID.
      SpecialOfferProduct is outside the 25-table projection, so no direct key exists in the source.
