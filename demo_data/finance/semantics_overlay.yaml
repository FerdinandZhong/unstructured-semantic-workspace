  CASA_Txn:
    label: CASA transactions
    description: >-
      One accepted CASA event row per workbook business snapshot. CASA means current
      account and savings account. An event can recur across snapshots. Amounts are
      unsigned and in source currency. They are transaction flows, not deposit balances,
      and they cannot supply a deposit balance. The transaction description and reference
      are excluded from this projection.
    synonyms: [CASA, current account and savings account transactions, deposit account transactions, account statement lines, payments and transfers, CASA movements]
    fields:
      SourceBatch: *SourceBatch
      BusinessDate: *BusinessDate
      TransactionID:
        <<: *TransactionID
        description: >-
          Workbook event identity within this transaction worksheet. It identifies one
          CASA transaction. The same ID can appear in more than one snapshot. Never
          display the value.
        concept: casa_transaction
      AccountNumber:
        <<: *TxnAccountNumber
        description: >-
          Restricted workbook-local account identifier of the current or savings account
          on which the transaction was recorded. Never display the value.
      CustomerID: *TxnCustomerID
      TransactionDate:
        <<: *TransactionDate
        description: >-
          Recorded event date of the CASA transaction. It is distinct from the business
          snapshot date.
      Currency: *TxnCurrency
      Amount:
        <<: *Amount
        label: CASA transaction amount
        description: >-
          Unsigned exact amount of one CASA transaction in the row currency. This amount
          is not an account balance or a deposit balance. Do not add amounts across
          currencies or across business dates.
        synonyms: [transaction value, payment amount, transfer amount, deposit amount, withdrawal amount, remittance amount]
        examples: ["What was the total CASA transaction value in SGD on 6 November 2026?"]
      DebitCredit: *DebitCredit
      Channel: *Channel
      Status: *TxnStatus
      BranchCode: *TxnBranchCode

