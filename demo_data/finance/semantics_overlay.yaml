# Business-semantics overlay for finance.ossie.yaml. Review candidate, not an approved model.
# Applied by demo_data/enrich_ossie.py. The base model is never edited.
# Data is synthetic. Code sets below are the values observed in the local CSV projection on
# 20 November 2026. The workbook Param and Dictionary sheets are not in this repository, so
# code meanings are stated only where the value is self-describing.

# Shared field blocks, reused with YAML merge keys. enrich_ossie.py ignores this key.
_shared:
  SourceBatch: &SourceBatch
    label: Source batch
    description: >-
      SHA-256 identity of the immutable source workbook batch, supplied by the projection.
      It is provenance, not a business attribute. Every query must select one batch, and
      every join must match on it. Never display the value.
    role: audit
  BusinessDate: &BusinessDate
    label: Business date
    description: >-
      Business snapshot date, also called the as-of date. Each row states what the bank
      recorded on that day. It is separate from an event date or a relationship effective
      date. The demo workbook holds daily snapshots for 4 to 6 November 2026. Never add
      counts or amounts across snapshot dates.
    synonyms: [as-of date, snapshot date, reporting date, position date, as at date]
    role: time
    concept: snapshot_date
  CustomerID: &CustomerID
    label: Customer ID
    description: >-
      Workbook-local customer identifier. It may identify a corporate or an individual
      customer. It is valid only inside this workbook. It is not a national or company
      registration number, and it does not link to a document or an external company
      without a separately reviewed identity decision. Never display the value.
    synonyms: [customer number, client ID, client number, CIF number, customer reference]
    role: identifier
    concept: customer
  RMID: &RMID
    label: Relationship manager ID
    description: >-
      Workbook-local relationship manager identifier. It is valid only inside this
      workbook. A display name alone cannot establish the same manager in another system.
      Never display the value.
    synonyms: [RM ID, RM code, banker ID, relationship manager number, account officer code]
    role: identifier
    concept: relationship_manager
  TxnAccountNumber: &TxnAccountNumber
    label: Account number
    synonyms: [account no, account ID, account reference]
    role: identifier
    concept: account
  TxnCustomerID: &TxnCustomerID
    <<: *CustomerID
  TransactionID: &TransactionID
    label: Transaction ID
    synonyms: [transaction reference, transaction number, txn ID, posting reference]
    role: identifier
  TransactionDate: &TransactionDate
    label: Transaction date
    synonyms: [posting date, value date, event date, date of transaction, txn date]
    role: time
    concept: transaction
  TxnCurrency: &TxnCurrency
    label: Transaction currency
    description: >-
      ISO currency code of the transaction amount on this row. This projection performs
      no conversion. Amounts in different currencies must not be added together.
    synonyms: [currency code, CCY, transaction CCY, denomination, native currency]
    role: dimension
    concept: currency
  Amount: &Amount
    label: Transaction amount
    synonyms: [transaction value, amount, txn amount, sum transacted, ticket size]
    role: measure
    unit: source currency
    concept: transaction_amount
  DebitCredit: &DebitCredit
    label: Debit or credit indicator
    description: >-
      Direction code of the transaction as supplied. Observed codes are CR and DR. The
      model does not infer a signed amount, an inflow or an outflow from this code.
    synonyms: [debit/credit indicator, DR/CR, Dr/Cr flag, debit or credit, transaction direction, money in or money out]
    role: dimension
    concept: transaction_direction
    values:
      CR: Observed code. CR is the usual abbreviation for credit. Meaning not recorded in the source.
      DR: Observed code. DR is the usual abbreviation for debit. Meaning not recorded in the source.
  Channel: &Channel
    label: Transaction channel
    description: >-
      Channel through which the transaction was recorded, as supplied. Observed values are
      Branch, Mobile, Online and SWIFT. The source records no further definition of each
      channel.
    synonyms: [channel, delivery channel, origination channel, how the transaction was made, banking channel]
    role: dimension
    concept: transaction_channel
    values:
      Branch: Recorded as Branch. Detailed meaning not recorded in the source.
      Mobile: Recorded as Mobile. Detailed meaning not recorded in the source.
      Online: Recorded as Online. Detailed meaning not recorded in the source.
      SWIFT: Recorded as SWIFT. Detailed meaning not recorded in the source.
  TxnStatus: &TxnStatus
    label: Transaction status
    description: >-
      Processing status of the transaction as recorded by this worksheet. The only observed
      value is Completed. Code meanings can vary across worksheets, so this status is not
      comparable with an account status or a relationship manager status.
    synonyms: [status, processing status, settlement status, txn status]
    role: dimension
    values:
      Completed: Recorded as Completed. Detailed meaning not recorded in the source.
  TxnBranchCode: &TxnBranchCode
    label: Transaction branch code
    description: >-
      Source code of the branch recorded on the transaction. Observed codes are BR001 to
      BR005. No certified reference maps a code to a branch name or location.
    synonyms: [branch, branch code, booking branch, processing branch, branch number]
    role: dimension
    concept: branch

attributions:
  - id: fibo
    name: Financial Industry Business Ontology (FIBO)
    publisher: Enterprise Data Management Council
    licence: MIT
    licence_url: https://github.com/edmcouncil/fibo/blob/master/LICENSE
    licence_line: Copyright (c) 2020 Enterprise Data Management Council
    source_url: https://github.com/edmcouncil/fibo
    fetched: "2026-11-21"
    use: Class label and skos:definition text, copied unchanged, as a secondary definition of the matching concept. The model's own description is never replaced.

subject_areas:
  - id: customer
    label: Customer
    description: >-
      Who the bank's customers are on a business date. Covers customer type, industry,
      segment, recorded risk rating, country and home branch.
    datasets: [Customers]
  - id: accounts_and_products
    label: Accounts and products
    description: >-
      The accounts each customer holds and the product behind each account. Covers product
      type, currency, opening date, booking location and account status. No balance is held.
    datasets: [Accounts]
  - id: relationship_coverage
    label: Relationship coverage
    description: >-
      Which relationship manager covers which customer, and where each manager sits in the
      organisation. Covers the manager roster, customer assignments and hierarchy records.
    datasets: [RelationshipManagers, Customer_RM_Relationship, RMHierarchy]
  - id: banking_transactions
    label: Banking transactions
    description: >-
      Transaction events on deposit, card, loan and investment accounts. Amounts are
      unsigned and in source currency. They are transaction flows, not balances.
    datasets: [CASA_Txn, CreditCard_Txn, Loan_Txn, Investment_Txn]
  - id: treasury_and_trade
    label: Treasury and trade
    description: >-
      Transaction events on treasury foreign exchange and letter of credit accounts.
      Amounts are unsigned and in source currency. An event here does not prove a settled
      trade payment or an export receipt.
    datasets: [Treasury_FX_Txn, Treasury_LC_Txn]
  - id: suspicious_transaction_reports
    label: Suspicious transaction reports
    description: >-
      Transactions stated on suspicious transaction report forms. A reporting institution
      writes each row. A report states a suspicion. It is not a finding of wrongdoing and
      it is not a booked workbook transaction. These rows are read from the form, not from
      the workbook.
    datasets: [STR_Transaction, STR_AccountEntity]

concepts:
  # Existing concepts. Ids, definitions and constraints are kept from the base model.
  - id: customer_count
    label: Customer count
    definition: Number of distinct customers present in a source batch on a business date.
    synonyms: [number of customers, customer base, client count, customer headcount, customers on book]
    broader: customer
  - id: account_status
    label: Account status
    definition: Whether an account is recorded as active in the source workbook.
    synonyms: [active account, inactive account, account state, account standing]
    broader: account
  - id: transaction_amount
    label: Transaction amount
    definition: >-
      Unsigned monetary value of one transaction event in its source currency. This is not
      an account balance.
    synonyms: [transaction value, amount transacted, payment amount, transaction size, turnover]
    broader: null
  - id: transaction_volume
    label: Transaction volume
    definition: Count of distinct transaction events in a source batch.
    synonyms: [number of transactions, transaction count, transaction frequency, activity level]
    broader: transaction
  - id: risk_rating
    label: Risk rating
    definition: >-
      Source-recorded customer risk classification. Never derived from adverse media or
      allegations.
    synonyms: [customer risk rating, risk grade, risk classification, risk category, risk profile]
    broader: null
    constraints: [filter_on_recorded_field_only, no_adverse_media]
  - id: large_transaction
    label: Large transaction
    definition: >-
      Transaction events exceeding a monetary threshold (Amount above 50000 in source
      currency). Not an STR flag.
    synonyms: [large-value transaction, high-value transaction, big-ticket transaction, transaction above threshold]
    broader: transaction_amount
  # Added concepts.
  - id: customer
    label: Customer
    definition: >-
      A corporate or individual party that holds a banking relationship in the workbook,
      identified by a workbook-local customer ID.
    synonyms: [client, account holder, borrower, counterparty, the company, the customer]
    broader: null
    fibo:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/Customer
      label: customer
      definition: >-
        party that receives or consumes products (goods or services) and has the ability to choose between different products and suppliers
      source_file: FND/ProductsAndServices/ProductsAndServices.rdf
      attribution: Enterprise Data Management Council, Financial Industry Business Ontology (FIBO)
      licence: MIT
      licence_url: https://github.com/edmcouncil/fibo/blob/master/LICENSE
      fetched: "2026-11-21"
  - id: customer_type
    label: Customer type
    definition: Whether the customer is recorded as a corporate or an individual customer.
    synonyms: [corporate or individual, legal entity type, client type, party type]
    broader: customer
  - id: industry
    label: Industry
    definition: >-
      The line of business recorded for a customer as a source industry code. A governed
      industry classification has not been established.
    synonyms: [sector, industry sector, line of business, business activity, industry classification]
    broader: customer
  - id: customer_segment
    label: Customer segment
    definition: >-
      The bank's own grouping of a customer for service and coverage, as recorded in the
      workbook. Tiers in other systems require a crosswalk.
    synonyms: [segment, client segment, banking segment, service tier, coverage segment]
    broader: customer
  - id: account
    label: Account
    definition: >-
      A product holding of one customer, identified by a workbook-local account number.
      No balance is recorded for an account.
    synonyms: [bank account, facility, product holding, account relationship]
    broader: null
    fibo:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/Account
      label: account
      definition: >-
        container for records associated with a business arrangement for regular transactions and services
      source_file: FBC/ProductsAndServices/ClientsAndAccounts.rdf
      attribution: Enterprise Data Management Council, Financial Industry Business Ontology (FIBO)
      licence: MIT
      licence_url: https://github.com/edmcouncil/fibo/blob/master/LICENSE
      fetched: "2026-11-21"
  - id: product
    label: Banking product
    definition: >-
      The product behind an account, recorded as a product type, a product subtype and a
      source product code.
    synonyms: [product, product type, product line, facility type, banking service, financial product]
    broader: account
    fibo:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/FinancialProduct
      label: financial product
      definition: >-
        product provided to consumers and businesses by financial institutions such as banks, insurance companies, brokerage firms, consumer finance companies, and investment companies
      source_file: FBC/ProductsAndServices/FinancialProductsAndServices.rdf
      attribution: Enterprise Data Management Council, Financial Industry Business Ontology (FIBO)
      licence: MIT
      licence_url: https://github.com/edmcouncil/fibo/blob/master/LICENSE
      fetched: "2026-11-21"
  - id: currency
    label: Currency
    definition: >-
      The ISO currency code in which an account is held or a transaction amount is stated.
      No conversion is performed.
    synonyms: [CCY, currency code, denomination, native currency]
    broader: null
    fibo:
      iri: https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CurrencyAmount/Currency
      label: currency
      definition: >-
        medium of exchange value, defined by reference to the geographical location of the monetary authorities responsible for it
      source_file: FND/Accounting/CurrencyAmount.rdf
      attribution: Enterprise Data Management Council, Financial Industry Business Ontology (FIBO)
      licence: MIT
      licence_url: https://github.com/edmcouncil/fibo/blob/master/LICENSE
      fetched: "2026-11-21"
  - id: branch
    label: Branch
    definition: >-
      A bank branch recorded as a source branch code. No certified reference maps the code
      to a branch name or location.
    synonyms: [branch office, booking branch, branch code, outlet]
    broader: null
  - id: relationship_manager
    label: Relationship manager
    definition: >-
      A bank employee who manages customer relationships, identified by a workbook-local
      relationship manager ID.
    synonyms: [RM, banker, account officer, coverage banker, relationship officer]
    broader: null
    fibo:
      iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/RelationshipManager
      label: relationship manager
      definition: >-
        responsible party who manages a client's account and oversees their relationship with the service provider
      source_file: FBC/ProductsAndServices/ClientsAndAccounts.rdf
      attribution: Enterprise Data Management Council, Financial Industry Business Ontology (FIBO)
      licence: MIT
      licence_url: https://github.com/edmcouncil/fibo/blob/master/LICENSE
      fetched: "2026-11-21"
  - id: rm_assignment
    label: Relationship manager assignment
    definition: >-
      The recorded link between one customer and one relationship manager, with a
      relationship type and effective dates.
    synonyms: [RM coverage, customer coverage, assigned RM, primary RM, portfolio assignment, book of clients]
    broader: relationship_manager
  - id: rm_hierarchy
    label: Relationship manager hierarchy
    definition: >-
      The organisational placement of a relationship manager by level, region and
      department. It does not establish who reports to whom.
    synonyms: [RM hierarchy, organisation level, coverage team structure, reporting level]
    broader: relationship_manager
  - id: snapshot_date
    label: Business snapshot date
    definition: >-
      The business date on which the workbook recorded a row. It is not the date an event
      happened or a relationship started.
    synonyms: [as-of date, business date, reporting date, position date]
    broader: null
  - id: transaction
    label: Transaction
    definition: >-
      One recorded money movement or product event on an account, dated by its transaction
      date. The same event can appear in more than one business snapshot.
    synonyms: [txn, posting, payment, transfer, account movement, account activity]
    broader: null
  - id: transaction_direction
    label: Transaction direction
    definition: >-
      The debit or credit indicator recorded on a transaction. The model infers no signed
      amount from it.
    synonyms: [debit or credit, DR/CR, inflow or outflow, money in or money out]
    broader: transaction
  - id: transaction_channel
    label: Transaction channel
    definition: The channel through which a transaction was recorded, such as branch, mobile, online or SWIFT.
    synonyms: [channel, delivery channel, banking channel, origination channel]
    broader: transaction
  - id: casa_transaction
    label: CASA transaction
    definition: A transaction event on a current account or savings account.
    synonyms: [current account transaction, savings account transaction, deposit account transaction, CASA movement, account transfer]
    broader: transaction
  - id: credit_card_transaction
    label: Credit card transaction
    definition: A transaction event on a credit card account.
    synonyms: [card transaction, card spend, card payment, card purchase, credit card activity]
    broader: transaction
  - id: loan_transaction
    label: Loan transaction
    definition: >-
      A transaction event on a loan account. The source does not record whether it is a
      drawdown, a repayment, interest or a fee.
    synonyms: [loan posting, loan movement, lending transaction, mortgage transaction, loan account activity]
    broader: transaction
  - id: investment_transaction
    label: Investment transaction
    definition: >-
      A transaction event on an investment account. The source does not record the
      security, the trade side or the quantity.
    synonyms: [investment trade, custody transaction, securities transaction, wealth transaction, portfolio transaction]
    broader: transaction
  - id: fx_transaction
    label: Foreign exchange transaction
    definition: >-
      A transaction event on a treasury foreign exchange account. It does not establish an
      export receipt, a hedge or an exchange rate.
    synonyms: [FX transaction, FX deal, forex trade, currency exchange, treasury FX]
    broader: transaction
  - id: letter_of_credit_transaction
    label: Letter of credit transaction
    definition: >-
      A transaction event on a treasury letter of credit account. It does not establish a
      settled import payment.
    synonyms: [LC transaction, L/C, documentary credit, trade finance transaction, import LC]
    broader: transaction
  - id: suspicious_transaction
    label: Suspicious transaction
    definition: >-
      A transaction a reporting institution states on a suspicious transaction report form.
      The report states a suspicion. It does not establish a crime or a booked workbook
      transaction.
    synonyms: [STR transaction, reported transaction, suspicious transaction report line, transaction of concern, flagged transaction]
    broader: transaction
  - id: suspicious_transaction_amount
    label: Suspicious transaction amount
    definition: >-
      The amount of one transaction stated on a suspicious transaction report form, in the
      original currency the form states. It is not a booked amount and it is not a balance.
    synonyms: [reported amount, STR amount, amount of the reported transaction, suspicious amount]
    broader: suspicious_transaction
  - id: reported_account
    label: Reported account
    definition: >-
      An account a suspicious transaction report form states in its account information
      group. The form states it. It does not link to a workbook account.
    synonyms: [account on a suspicious transaction report, STR account, reported account information]
    broader: null
  - id: reported_entity
    label: Reported entity
    definition: >-
      An individual or organisation a suspicious transaction report form profiles in its
      entity profile group. The form states it. It does not resolve to a workbook customer.
    synonyms: [entity on a suspicious transaction report, STR entity profile, profiled entity]
    broader: null

datasets:
  Customers:
    label: Customers
    description: >-
      One accepted customer per workbook business snapshot. Holds the customer's type,
      industry code, segment, recorded risk rating, country of operation and home branch.
      Corporate and individual customers share this table. Customer names, identity
      numbers, dates of birth or incorporation and contact details are excluded from this
      projection.
    synonyms: [customer master, client master, customer list, customer profile, client base, customer static data]
    fields:
      SourceBatch: *SourceBatch
      BusinessDate: *BusinessDate
      CustomerID:
        <<: *CustomerID
        examples: ["How many customers were on book on 6 November 2026?"]
      CustomerType:
        label: Customer type
        description: >-
          Source customer type for an accepted customer snapshot. It separates companies
          from natural persons. Observed values are Corporate and Individual.
        synonyms: [client type, corporate or individual, entity type, legal form, party type, company or person]
        role: dimension
        concept: customer_type
        values:
          Corporate: Recorded as a corporate customer.
          Individual: Recorded as an individual customer.
      IndustryCode:
        label: Industry code
        description: >-
          Industry code as supplied, written as a four-digit code and a short label. A
          governed industry classification has not been established, so the code system
          is unconfirmed. The value also appears on individual customers. Decode and
          compare the code system before mapping it to a sector label in another model.
        synonyms: [industry, sector, industry sector, line of business, business activity, industry classification]
        role: dimension
        concept: industry
        values:
          3510-Energy: Source label Energy. Code system not recorded in the source.
          4641-Trading: Source label Trading. Code system not recorded in the source.
          6201-Software: Source label Software. Code system not recorded in the source.
          6419-Banking: Source label Banking. Code system not recorded in the source.
          6810-RealEstate: Source label RealEstate. Code system not recorded in the source.
          8610-Healthcare: Source label Healthcare. Code system not recorded in the source.
      RiskRating:
        label: Risk rating
        description: >-
          Workbook-recorded risk rating of the customer in its own source population.
          Observed values are Low and Medium. No customer is rated High in this demo data.
          The source does not record the rating scale or the policy behind it. The rating
          is read from this column only. It is never derived from adverse media, news or
          allegations in a document.
        synonyms: [customer risk rating, risk grade, risk classification, risk category, risk level, risk profile]
        role: dimension
        concept: risk_rating
        values:
          Low: Recorded as Low. Scale definition not recorded in the source.
          Medium: Recorded as Medium. Scale definition not recorded in the source.
        examples: ["How many customers have a recorded risk rating of Medium?"]
      CustomerSegment:
        label: Customer segment
        description: >-
          Workbook customer segment, the bank's own grouping of the customer. Observed
          values mix consumer and business tiers. The banking and Looker tiers require a
          crosswalk before segments are compared across sources.
        synonyms: [segment, client segment, banking segment, service tier, customer tier, coverage segment]
        role: dimension
        concept: customer_segment
        values:
          CBK: Observed code. Meaning not recorded in the source.
          CMB: Observed code. Meaning not recorded in the source.
          Corporate: Recorded as Corporate. Tier definition not recorded in the source.
          Premier: Recorded as Premier. Tier definition not recorded in the source.
          Priority: Recorded as Priority. Tier definition not recorded in the source.
          Private: Recorded as Private. Tier definition not recorded in the source.
          Retail: Recorded as Retail. Tier definition not recorded in the source.
      CountryOfOperation:
        label: Country of operation
        description: >-
          Country of operation as supplied for the customer, as a two-letter country code.
          The only observed value is SG. It is not the country of residence or of tax
          residence, which this projection excludes.
        synonyms: [operating country, country, market, place of business, where the customer operates, jurisdiction]
        role: dimension
        values:
          SG: Two-letter country code SG, as supplied.
      BranchCode:
        label: Customer branch code
        description: >-
          Source code of the branch recorded on the customer. Observed codes are BR001 to
          BR005. The source has no certified reference mapping from a code to a branch
          name or location.
        synonyms: [branch, home branch, servicing branch, branch code, branch number]
        role: dimension
        concept: branch

  Accounts:
    label: Accounts
    description: >-
      One accepted account per workbook business snapshot. Each account belongs to one
      customer and carries its product type, currency, opening date, booking country,
      branch and status. No balance value and no maturity date are supplied. A deposit or
      loan balance cannot be read from this table or built from transaction amounts.
    synonyms: [account master, account list, product holdings, customer accounts, facilities, account static data]
    fields:
      SourceBatch: *SourceBatch
      BusinessDate: *BusinessDate
      AccountNumber:
        <<: *TxnAccountNumber
        description: >-
          Restricted workbook-local account identifier. It is the key of the account and
          the join key for all transaction tables. The format differs by product. Never
          display the value.
      CustomerID:
        <<: *CustomerID
      Currency:
        label: Account currency
        description: >-
          Native currency code of the account, as an ISO code. Observed values are EUR,
          HKD, JPY, SGD and USD. This projection performs no conversion.
        synonyms: [currency code, CCY, account CCY, denomination, native currency]
        role: dimension
        concept: currency
        values:
          EUR: ISO currency code EUR.
          HKD: ISO currency code HKD.
          JPY: ISO currency code JPY.
          SGD: ISO currency code SGD.
          USD: ISO currency code USD.
      ProductType:
        label: Product type
        description: >-
          Source account product category. It names the business line of the account and
          matches one transaction table each. Observed values are CASA, CreditCard,
          Investment, Loan, Treasury_FX and Treasury_LC.
        synonyms: [product, product category, product line, account type, facility type, type of account]
        role: dimension
        concept: product
        values:
          CASA: Current account or savings account. Transactions are in CASA_Txn.
          CreditCard: Credit card account. Transactions are in CreditCard_Txn.
          Investment: Investment account. Transactions are in Investment_Txn.
          Loan: Loan account. Transactions are in Loan_Txn.
          Treasury_FX: Treasury foreign exchange account. Transactions are in Treasury_FX_Txn.
          Treasury_LC: Treasury letter of credit account. Transactions are in Treasury_LC_Txn.
      ProductSubType:
        label: Product subtype
        description: >-
          Source account product subcategory, one level below the product type. Observed
          values are Current, Savings, Visa, Custody, Mortgage, FX and LC.
        synonyms: [product subcategory, sub-product, product variant, account subtype, current or savings]
        role: dimension
        concept: product
        values:
          Current: Recorded as Current.
          Savings: Recorded as Savings.
          Visa: Recorded as Visa.
          Custody: Recorded as Custody.
          Mortgage: Recorded as Mortgage.
          FX: Recorded as FX.
          LC: Recorded as LC.
      ProductCode:
        label: Product code
        description: >-
          Source product code with no certified reference mapping. Observed codes run from
          P000 to P019. The meaning of each code is not recorded in the source, so the code
          must not be read as a product name.
        synonyms: [product ID, product identifier, scheme code, internal product code]
        role: dimension
        concept: product
      OpenDate:
        label: Account open date
        description: >-
          Recorded account opening date. It dates the account, not the customer. It does
          not establish when the customer was onboarded.
        synonyms: [opening date, account opening date, date opened, account start date, opened on]
        role: time
      BookingCountry:
        label: Booking country
        description: >-
          Source account booking country, the country where the account is booked, as a
          two-letter code. The only observed value is SG.
        synonyms: [booking location, booking centre, booking entity country, country of booking, booked in]
        role: dimension
        values:
          SG: Two-letter country code SG, as supplied.
      BranchCode:
        label: Account branch code
        description: >-
          Source code of the branch that holds the account. Observed codes are BR001 to
          BR005. The source has no certified reference mapping from a code to a branch.
        synonyms: [branch, account branch, booking branch, branch code, branch number]
        role: dimension
        concept: branch
      Status:
        label: Account status
        description: >-
          Status of the account as recorded by this worksheet. Observed values are Active
          and Inactive. The status is source-recorded only and is not inferred from
          transactions. Code meanings can vary across worksheets.
        synonyms: [status, account state, active or inactive, active account, inactive account, account standing]
        role: dimension
        concept: account_status
        values:
          Active: Recorded as Active.
          Inactive: Recorded as Inactive. The reason is not recorded in the source.
