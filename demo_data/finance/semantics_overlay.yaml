  STR_Transaction:
    label: Reported suspicious transactions
    description: >-
      One transaction per row, read from a suspicious transaction report form. Form field
      names are the column names. The form states the values. The rows are written only
      after an admin confirms a preview, and every cell keeps its source span. This table
      holds forms, not workbook data. It is template-bound physical mapping that works only
      for this form type.
    synonyms: [suspicious transaction report, STR, reported suspicious transactions, STR transactions, suspicious activity report lines]
    fields:
      SourceRevision:
        label: Source revision
        description: >-
          SHA-256 identity of the form file this row was read from. It is provenance,
          not a business attribute. It is supplied by the system, not stated in the form. Never
          display the value.
        role: audit
        concept: suspicious_transaction
      TransactionSeq:
        label: Transaction position
        description: >-
          Position of the transaction in the form's repeating Transaction group, counted from 1.
          The system supplies it. It is not a transaction reference stated by the institution.
        role: identifier
        concept: suspicious_transaction
      AccountNo:
        label: Form account reference
        description: >-
          Account reference the form states for this transaction. It is valid only inside the
          form. It does not link to a workbook account number. Never display the value.
        role: identifier
        concept: suspicious_transaction
      IsActualTransaction:
        label: Actual transaction flag
        description: >-
          The form's Y or N flag that states whether the reported transaction is an actual
          transaction.
        role: attribute
        concept: suspicious_transaction
      TransactionType:
        label: Reported transaction type
        description: >-
          Transaction type code chosen on the form. The code list is not part of the supplied
          material, so the meaning of a code is not stated.
        role: dimension
        concept: suspicious_transaction
        synonyms: [transaction type code, STR transaction type, type of reported transaction]
      InOutTrans:
        label: Reported direction
        description: >-
          Direction of the reported transaction as the form states it, for example OUTWARD.
        role: dimension
        concept: suspicious_transaction
        synonyms: [inward or outward, direction of transaction, in or out]
      AmountOriginalCurrency:
        label: Reported amount currency
        description: >-
          ISO currency code of the original amount the form states. No conversion is performed.
        role: dimension
        concept: suspicious_transaction_amount
        synonyms: [reported currency, STR currency, original currency, currency of the reported amount]
      AmountOriginal:
        label: Reported original amount
        description: >-
          Exact amount the form states for the reported transaction, in the original currency
          the form states. It is not a booked amount, a balance, or a converted amount. Do not
          add amounts across currencies.
        role: measure
        concept: suspicious_transaction_amount
        unit: original currency
        synonyms: [reported amount, suspicious amount, amount reported, value of reported transaction]
        examples: ["What is the total reported suspicious transaction value in SGD?"]
      OverPeriodTime:
        label: Over a period flag
        description: >-
          The form's Y or N flag that states whether the reported activity ran over a period of
          time rather than on one date.
        role: attribute
        concept: suspicious_transaction
      StartDate:
        label: Reported start date
        description: >-
          Date the form states for the start of the reported transaction. It is the only date
          held for the transaction. It is not a snapshot date.
        role: time
        concept: suspicious_transaction
      SourceCountry:
        label: Reported source country
        description: >-
          ISO country code the form states as the country the funds came from.
        role: dimension
        concept: suspicious_transaction
        synonyms: [country of origin, originating country, country funds came from]
      DestinationCountry:
        label: Reported destination country
        description: >-
          ISO country code the form states as the country the funds went to.
        role: dimension
        concept: suspicious_transaction
        synonyms: [destination, receiving country, country funds went to]
      CounterpartyName:
        label: Counterparty name
        description: >-
          Name of the counterparty exactly as the form states it. Names do not resolve to a
          customer without a reviewed identity decision. Never display the value.
        role: attribute
        concept: suspicious_transaction
      CounterpartyBankName:
        label: Counterparty bank name
        description: >-
          Name of the counterparty's bank exactly as the form states it.
        role: attribute
        concept: suspicious_transaction
      CounterpartyAccountNo:
        label: Counterparty account number
        description: >-
          Account number of the counterparty as the form states it. It is valid only inside the
