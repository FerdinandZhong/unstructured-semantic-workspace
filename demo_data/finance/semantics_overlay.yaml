        description: >-
          Total assets under management the form states for the entity, in the currency the form
          states. It is a form statement, not a workbook balance.
        role: measure
        concept: reported_entity
        unit: original currency
        synonyms: [assets under management, AUM, total assets managed]
      OutstandingLoansCurrency:
        label: Outstanding loans currency
        description: >-
          ISO currency code of the outstanding loans the form states for the entity.
        role: dimension
        concept: reported_entity
        synonyms: [loans currency, outstanding loan currency]
      OutstandingLoans:
        label: Outstanding loans
        description: >-
          Outstanding loans the form states for the entity, in the currency the form states. It is
          a form statement, not a workbook loan balance.
        role: measure
        concept: reported_entity
        unit: original currency
        synonyms: [loans outstanding, outstanding loan amount, entity loans]

relationships:
  - name: STR_Transaction_to_STR_AccountEntity_derived
    from: STR_Transaction
    to: STR_AccountEntity
    from_columns: [SourceRevision]
    to_columns: [SourceRevision]
    derived: true
    join_scope: source_revision
    justification: >-
      Both tables are read from the same suspicious transaction report form, and each row
      carries the SHA-256 of that form as SourceRevision. The form does not state which
      account or entity a transaction belongs to. The join relates rows of one form only. If
      one form holds several account or entity rows, a total over the reported transactions
      repeats for each of them.

metrics:
  customers_on_business_date:
    label: Customers on business date
    synonyms: [number of customers, customer count, customer base, total customers, clients on book, customer headcount]
    examples:
      - "How many customers were there on 6 November 2026?"
      - "How many corporate customers were on book on 6 November 2026?"
  distinct_customers_in_period:
    label: Distinct customers in period
    synonyms: [unique customers, unique clients over a period, customers seen in period, distinct client count]
    examples:
      - "How many distinct customers appeared between 4 and 6 November 2026?"
  active_accounts:
    label: Active accounts
    synonyms: [number of active accounts, open accounts, live accounts, active account count, accounts in use]
    examples:
      - "How many active accounts were there on 6 November 2026?"
      - "How many active accounts does each product type have on 6 November 2026?"
  casa_transaction_value:
    label: CASA transaction value
    synonyms: [CASA turnover, CASA throughput, current and savings account transaction value, deposit account flows, total CASA transaction amount]
    examples:
      - "What was the total CASA transaction value in SGD on 6 November 2026?"
      - "What was the CASA transaction value by branch for USD transactions on 6 November 2026?"
  casa_transaction_count:
    label: CASA transaction count
    synonyms: [number of CASA transactions, CASA transaction volume, transaction frequency, number of transactions, account activity count]
    examples:
      - "How many CASA transactions were recorded on 6 November 2026?"
      - "How many CASA transactions went through each channel on 5 November 2026?"
  credit_card_transaction_value:
    label: Credit card transaction value
    synonyms: [card spend, credit card spend, card turnover, total card transaction amount, card billings]
    examples:
      - "What was the total credit card transaction value in SGD on 6 November 2026?"
  large_casa_transaction_count:
    label: Large CASA transaction count
    synonyms: [large transactions, high-value CASA transactions, transactions above 50000, big-ticket transactions, large-value payments]
    examples:
      - "How many CASA transactions above 50000 were recorded on 6 November 2026?"
  high_risk_customers:
    label: High-risk customers
    synonyms: [high risk clients, customers rated High, high-risk customer count, number of high-risk customers]
    examples:
      - "How many customers had a recorded risk rating of High on 6 November 2026?"
      - "How many high-risk customers are there in each industry on 6 November 2026?"

  reported_suspicious_transactions:
    label: Reported suspicious transactions
    synonyms: [number of suspicious transactions, STR lines, reported suspicious transactions]
    examples:
      - "Count the reported suspicious transactions."
  reported_suspicious_transaction_value:
    label: Reported suspicious transaction value
    synonyms: [total suspicious transaction value, reported suspicious amount, STR amount total, total reported suspicious transaction value]
    examples:
      - "What is the total reported suspicious transaction value in SGD?"

