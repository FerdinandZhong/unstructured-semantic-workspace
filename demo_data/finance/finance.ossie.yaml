metrics:
- name: customers_on_business_date
  description: Count distinct customer IDs in one source batch on the selected business date.
  datatype: Integer
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT Customers.CustomerID)
  custom_extensions:
  - vendor_name: HELIOS
    data: '{"additive_across_dates": false, "allowed_dimensions": ["CustomerType", "IndustryCode"], "concept":
      "customer_count", "dataset": "Customers", "grain": "customer snapshot", "label": "Customers on business
      date", "required_filters": {"BusinessDate": "single_value", "SourceBatch": "single_value"}, "review_state":
      "authored_demo_candidate", "time_field": "BusinessDate", "unit": "count"}'
  ai_context:
    synonyms:
    - number of customers
    - customer count
    - customer base
    - total customers
    - clients on book
    - customer headcount
    examples:
    - How many customers were there on 6 November 2026?
    - How many corporate customers were on book on 6 November 2026?
- name: distinct_customers_in_period
  description: Count each customer ID once in one source batch across the selected business dates, including
    both endpoints.
  datatype: Integer
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT Customers.CustomerID)
  custom_extensions:
  - vendor_name: HELIOS
    data: '{"additive_across_dates": false, "allowed_dimensions": ["CustomerType", "IndustryCode"], "concept":
      "customer_count", "dataset": "Customers", "grain": "customer snapshot", "label": "Distinct customers
      in period", "required_filters": {"BusinessDate": "inclusive_range", "SourceBatch": "single_value"},
      "review_state": "authored_demo_candidate", "time_field": "BusinessDate", "unit": "count"}'
  ai_context:
    synonyms:
    - unique customers
    - unique clients over a period
    - customers seen in period
    - distinct client count
    examples:
    - How many distinct customers appeared between 4 and 6 November 2026?
- name: active_accounts
  description: Count of distinct accounts recorded as Active in one source batch on a business date. Counts
    distinct AccountNumber values to avoid inflating the result across snapshot rows. Status is source-recorded
