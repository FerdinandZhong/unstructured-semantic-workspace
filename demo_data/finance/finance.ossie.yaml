- name: STR_AccountEntity
  source: str_form.STR_AccountEntity
  description: 'One row per group position, read from the Account group of AccountInformation and the
    Entity group of EntityProfile on a suspicious transaction report form. Form field names are the column
    names. The form states the values. Rows are written only after an admin confirms a preview, and every
    cell keeps its source span. Names, birth date parts, sex, email, address, contact details and identification
    numbers are not columns: they are personal data and the identification subgroup can hold an NRIC.
    The Account and Entity of one position share a row by position only. The form does not state that
    they belong together. Join to STR_Transaction by SourceRevision to relate them to the reported transactions
    of the same form. Template-bound physical mapping that works only for this form type.'
  primary_key:
  - SourceRevision
  - GroupSeq
  fields:
  - name: SourceRevision
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SourceRevision
    description: SHA-256 identity of the form file this row was read from. It is provenance, not a business
      attribute. It is supplied by the system, not stated in the form. Never display the value.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"concept": "reported_account", "provenance": "system: SHA-256 of the form file", "role":
        "audit"}'
    label: Source revision
  - name: GroupSeq
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: GroupSeq
    description: Position of the Account and Entity group rows in the form, counted from 1. The system
      supplies it. It is not a reference stated by the institution.
    datatype: Integer
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"concept": "reported_account", "provenance": "system: position of the Account and Entity
        group rows", "role": "identifier"}'
    label: Group position
  - name: IsAccMaintainedWithRI
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: IsAccMaintainedWithRI
    description: The form's Y or N flag that states whether the reported account is maintained with the
      reporting institution. N means it is held elsewhere.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"concept": "reported_account", "provenance": "form field name", "role": "dimension"}'
    label: Account maintained with the reporting institution flag
    ai_context:
      synonyms:
      - account held here
      - maintained with reporting institution
      - own bank account flag
  - name: IsAccHeldBankOrNonBank
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: IsAccHeldBankOrNonBank
    description: Code the form uses to state whether the account is held with a bank or a non-bank. The
      code list is not part of the supplied material.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"concept": "reported_account", "provenance": "form field name", "role": "dimension"}'
    label: Account held with bank or non-bank code
    ai_context:
      synonyms:
      - bank or non-bank
      - account holder institution type
  - name: BankName
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: BankName
    description: Name of the institution holding the reported account, exactly as the form states it.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"concept": "reported_account", "provenance": "form field name", "role": "attribute"}'
    label: Account bank name
  - name: AccNum
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AccNum
    description: Account number the form states for the reported account. It is valid only inside the
      form and does not link to a workbook account. Never display the value. Never display the value.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"concept": "reported_account", "provenance": "form field name", "role": "identifier"}'
    label: Reported account number
  - name: AccDate
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AccDate
    description: Date the form states for the reported account (dd/mm/yyyy on the form). It is the only
      date of the account held here.
    datatype: Date
    dimension:
      is_time: true
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"concept": "reported_account", "provenance": "form field name", "role": "time"}'
    label: Account opening date
  - name: AccBalDRCR
    expression:
