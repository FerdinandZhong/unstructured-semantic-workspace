version: 0.2.0.dev0
name: finance_workbook_demo
description: Authored finance workbook model candidate. Contains metadata only.
ai_context:
  instructions: Use only authorized accepted rows and join on the workbook batch and business date. Never
    sum repeated snapshots, combine native currencies, derive balances or rank across unreviewed populations.
    Require a separately reviewed identity decision for document or external-company links. Preserve recorded
    risk separately from allegations.
datasets:
- name: Customers
  source: finance_workbook.Customers
  description: One accepted customer per workbook business snapshot. Holds the customer's type, industry
    code, segment, recorded risk rating, country of operation and home branch. Corporate and individual
    customers share this table. Customer names, identity numbers, dates of birth or incorporation and
    contact details are excluded from this projection.
  primary_key:
  - SourceBatch
  - BusinessDate
  - CustomerID
  fields:
  - name: SourceBatch
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SourceBatch
    description: SHA-256 identity of the immutable source workbook batch, supplied by the projection.
      It is provenance, not a business attribute. Every query must select one batch, and every join must
      match on it. Never display the value.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"access": "internal join key; never render source identifier values", "provenance": "batch
        hash", "role": "audit"}'
    label: Source batch
  - name: BusinessDate
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: BusinessDate
    description: Business snapshot date, also called the as-of date. Each row states what the bank recorded
      on that day. It is separate from an event date or a relationship effective date. The demo workbook
      holds daily snapshots for 4 to 6 November 2026. Never add counts or amounts across snapshot dates.
    datatype: Date
    dimension:
      is_time: true
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"access": "source-scoped metadata", "concept": "snapshot_date", "provenance": "worksheet
        header", "role": "time"}'
    label: Business date
    ai_context:
      synonyms:
      - as-of date
      - snapshot date
      - reporting date
      - position date
      - as at date
  - name: CustomerID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: CustomerID
    description: Workbook-local customer identifier. It may identify a corporate or an individual customer.
      It is valid only inside this workbook. It is not a national or company registration number, and
      it does not link to a document or an external company without a separately reviewed identity decision.
      Never display the value.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"access": "internal join key; never render source identifier values", "concept": "customer",
        "provenance": "worksheet header", "role": "identifier"}'
    label: Customer ID
    ai_context:
      synonyms:
      - customer number
      - client ID
      - client number
      - CIF number
      - customer reference
      examples:
      - How many customers were on book on 6 November 2026?
  - name: CustomerType
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: CustomerType
    description: Source customer type for an accepted customer snapshot. It separates companies from natural
      persons. Observed values are Corporate and Individual.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"access": "source-scoped metadata", "concept": "customer_type", "provenance": "worksheet
        header", "role": "dimension", "values": {"Corporate": "Recorded as a corporate customer.", "Individual":
        "Recorded as an individual customer."}}'
    label: Customer type
    ai_context:
      synonyms:
      - client type
      - corporate or individual
      - entity type
      - legal form
      - party type
      - company or person
  - name: IndustryCode
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: IndustryCode
    description: Industry code as supplied, written as a four-digit code and a short label. A governed
      industry classification has not been established, so the code system is unconfirmed. The value also
      appears on individual customers. Decode and compare the code system before mapping it to a sector
      label in another model.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"access": "source-scoped metadata", "concept": "industry", "provenance": "worksheet header",
        "role": "dimension", "values": {"3510-Energy": "Source label Energy. Code system not recorded
        in the source.", "4641-Trading": "Source label Trading. Code system not recorded in the source.",
        "6201-Software": "Source label Software. Code system not recorded in the source.", "6419-Banking":
        "Source label Banking. Code system not recorded in the source.", "6810-RealEstate": "Source label
        RealEstate. Code system not recorded in the source.", "8610-Healthcare": "Source label Healthcare.
        Code system not recorded in the source."}}'
    label: Industry code
    ai_context:
      synonyms:
      - industry
      - sector
      - industry sector
      - line of business
      - business activity
      - industry classification
  - name: RiskRating
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: RiskRating
    description: Workbook-recorded risk rating of the customer in its own source population. Observed
      values are Low and Medium. No customer is rated High in this demo data. The source does not record
      the rating scale or the policy behind it. The rating is read from this column only. It is never
      derived from adverse media, news or allegations in a document.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"access": "source-scoped metadata", "concept": "risk_rating", "provenance": "worksheet header",
        "role": "dimension", "values": {"Low": "Recorded as Low. Scale definition not recorded in the
        source.", "Medium": "Recorded as Medium. Scale definition not recorded in the source."}}'
    label: Risk rating
    ai_context:
      synonyms:
      - customer risk rating
      - risk grade
      - risk classification
      - risk category
      - risk level
      - risk profile
      examples:
      - How many customers have a recorded risk rating of Medium?
  - name: CustomerSegment
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: CustomerSegment
    description: Workbook customer segment, the bank's own grouping of the customer. Observed values mix
      consumer and business tiers. The banking and Looker tiers require a crosswalk before segments are
      compared across sources.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"access": "source-scoped metadata", "concept": "customer_segment", "provenance": "worksheet
        header", "role": "dimension", "values": {"CBK": "Observed code. Meaning not recorded in the source.",
        "CMB": "Observed code. Meaning not recorded in the source.", "Corporate": "Recorded as Corporate.
        Tier definition not recorded in the source.", "Premier": "Recorded as Premier. Tier definition
        not recorded in the source.", "Priority": "Recorded as Priority. Tier definition not recorded
        in the source.", "Private": "Recorded as Private. Tier definition not recorded in the source.",
        "Retail": "Recorded as Retail. Tier definition not recorded in the source."}}'
    label: Customer segment
    ai_context:
      synonyms:
      - segment
      - client segment
      - banking segment
      - service tier
      - customer tier
      - coverage segment
  - name: CountryOfOperation
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: CountryOfOperation
    description: Country of operation as supplied for the customer, as a two-letter country code. The
      only observed value is SG. It is not the country of residence or of tax residence, which this projection
      excludes.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"access": "source-scoped metadata", "provenance": "worksheet header", "role": "dimension",
        "values": {"SG": "Two-letter country code SG, as supplied."}}'
    label: Country of operation
    ai_context:
      synonyms:
      - operating country
      - country
      - market
      - place of business
      - where the customer operates
      - jurisdiction
  - name: BranchCode
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: BranchCode
    description: Source code of the branch recorded on the customer. Observed codes are BR001 to BR005.
      The source has no certified reference mapping from a code to a branch name or location.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"access": "source-scoped metadata", "concept": "branch", "provenance": "worksheet header",
        "role": "dimension"}'
    label: Customer branch code
    ai_context:
      synonyms:
      - branch
      - home branch
      - servicing branch
      - branch code
      - branch number
  custom_extensions:
  - vendor_name: HELIOS
    data: '{"excluded_headers": ["CustomerName", "ID", "DOBOrIncorpDate", "CountryOfResidence", "MaritalStatus",
      "Site ID", "TaxResidence", "CostCenter", "PhoneNumber", "Staff"], "label": "Customers", "retention":
      "accepted only", "source_type": "logical projection", "subject_area": "customer", "worksheet": "Customers"}'
  ai_context:
    synonyms:
    - customer master
    - client master
    - customer list
    - customer profile
    - client base
    - customer static data
- name: Accounts
  source: finance_workbook.Accounts
  description: One accepted account per workbook business snapshot. Each account belongs to one customer
    and carries its product type, currency, opening date, booking country, branch and status. No balance
    value and no maturity date are supplied. A deposit or loan balance cannot be read from this table
    or built from transaction amounts.
  primary_key:
  - SourceBatch
  - BusinessDate
  - AccountNumber
  fields:
  - name: SourceBatch
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SourceBatch
    description: SHA-256 identity of the immutable source workbook batch, supplied by the projection.
      It is provenance, not a business attribute. Every query must select one batch, and every join must
      match on it. Never display the value.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"access": "internal join key; never render source identifier values", "provenance": "batch
        hash", "role": "audit"}'
    label: Source batch
  - name: BusinessDate
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: BusinessDate
    description: Business snapshot date, also called the as-of date. Each row states what the bank recorded
      on that day. It is separate from an event date or a relationship effective date. The demo workbook
      holds daily snapshots for 4 to 6 November 2026. Never add counts or amounts across snapshot dates.
    datatype: Date
    dimension:
      is_time: true
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"access": "source-scoped metadata", "concept": "snapshot_date", "provenance": "worksheet
        header", "role": "time"}'
    label: Business date
    ai_context:
      synonyms:
      - as-of date
      - snapshot date
      - reporting date
      - position date
      - as at date
  - name: AccountNumber
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AccountNumber
    description: Restricted workbook-local account identifier. It is the key of the account and the join
      key for all transaction tables. The format differs by product. Never display the value.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"access": "internal join key; never render source identifier values", "concept": "account",
        "provenance": "worksheet header", "role": "identifier"}'
    label: Account number
    ai_context:
      synonyms:
      - account no
      - account ID
      - account reference
  - name: CustomerID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: CustomerID
    description: Workbook-local customer identifier. It may identify a corporate or an individual customer.
      It is valid only inside this workbook. It is not a national or company registration number, and
      it does not link to a document or an external company without a separately reviewed identity decision.
      Never display the value.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"access": "internal join key; never render source identifier values", "concept": "customer",
        "provenance": "worksheet header", "role": "identifier"}'
    label: Customer ID
    ai_context:
      synonyms:
      - customer number
      - client ID
      - client number
      - CIF number
      - customer reference
  - name: Currency
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Currency
    description: Native currency code of the account, as an ISO code. Observed values are EUR, HKD, JPY,
      SGD and USD. This projection performs no conversion.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"access": "source-scoped metadata", "concept": "currency", "provenance": "worksheet header",
        "role": "dimension", "values": {"EUR": "ISO currency code EUR.", "HKD": "ISO currency code HKD.",
        "JPY": "ISO currency code JPY.", "SGD": "ISO currency code SGD.", "USD": "ISO currency code USD."}}'
    label: Account currency
    ai_context:
      synonyms:
      - currency code
      - CCY
      - account CCY
      - denomination
      - native currency
  - name: ProductType
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ProductType
    description: Source account product category. It names the business line of the account and matches
      one transaction table each. Observed values are CASA, CreditCard, Investment, Loan, Treasury_FX
      and Treasury_LC.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"access": "source-scoped metadata", "concept": "product", "provenance": "worksheet header",
        "role": "dimension", "values": {"CASA": "Current account or savings account. Transactions are
        in CASA_Txn.", "CreditCard": "Credit card account. Transactions are in CreditCard_Txn.", "Investment":
        "Investment account. Transactions are in Investment_Txn.", "Loan": "Loan account. Transactions
        are in Loan_Txn.", "Treasury_FX": "Treasury foreign exchange account. Transactions are in Treasury_FX_Txn.",
        "Treasury_LC": "Treasury letter of credit account. Transactions are in Treasury_LC_Txn."}}'
    label: Product type
    ai_context:
      synonyms:
      - product
      - product category
      - product line
      - account type
      - facility type
      - type of account
  - name: ProductSubType
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ProductSubType
    description: Source account product subcategory, one level below the product type. Observed values
      are Current, Savings, Visa, Custody, Mortgage, FX and LC.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"access": "source-scoped metadata", "concept": "product", "provenance": "worksheet header",
        "role": "dimension", "values": {"Current": "Recorded as Current.", "Custody": "Recorded as Custody.",
        "FX": "Recorded as FX.", "LC": "Recorded as LC.", "Mortgage": "Recorded as Mortgage.", "Savings":
        "Recorded as Savings.", "Visa": "Recorded as Visa."}}'
    label: Product subtype
    ai_context:
      synonyms:
      - product subcategory
      - sub-product
      - product variant
      - account subtype
      - current or savings
  - name: ProductCode
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ProductCode
    description: Source product code with no certified reference mapping. Observed codes run from P000
      to P019. The meaning of each code is not recorded in the source, so the code must not be read as
      a product name.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"access": "source-scoped metadata", "concept": "product", "provenance": "worksheet header",
        "role": "dimension"}'
    label: Product code
    ai_context:
      synonyms:
      - product ID
      - product identifier
      - scheme code
      - internal product code
  - name: OpenDate
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: OpenDate
    description: Recorded account opening date. It dates the account, not the customer. It does not establish
      when the customer was onboarded.
    datatype: Date
    dimension:
      is_time: true
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"access": "source-scoped metadata", "provenance": "worksheet header", "role": "time"}'
    label: Account open date
    ai_context:
      synonyms:
      - opening date
      - account opening date
      - date opened
      - account start date
      - opened on
  - name: BookingCountry
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: BookingCountry
    description: Source account booking country, the country where the account is booked, as a two-letter
      code. The only observed value is SG.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"access": "source-scoped metadata", "provenance": "worksheet header", "role": "dimension",
        "values": {"SG": "Two-letter country code SG, as supplied."}}'
    label: Booking country
    ai_context:
      synonyms:
      - booking location
      - booking centre
      - booking entity country
      - country of booking
      - booked in
  - name: BranchCode
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: BranchCode
    description: Source code of the branch that holds the account. Observed codes are BR001 to BR005.
      The source has no certified reference mapping from a code to a branch.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"access": "source-scoped metadata", "concept": "branch", "provenance": "worksheet header",
        "role": "dimension"}'
    label: Account branch code
    ai_context:
      synonyms:
      - branch
      - account branch
      - booking branch
      - branch code
      - branch number
  - name: Status
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Status
    description: Status of the account as recorded by this worksheet. Observed values are Active and Inactive.
      The status is source-recorded only and is not inferred from transactions. Code meanings can vary
      across worksheets.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"access": "source-scoped metadata", "concept": "account_status", "provenance": "worksheet
        header", "role": "dimension", "values": {"Active": "Recorded as Active.", "Inactive": "Recorded
        as Inactive. The reason is not recorded in the source."}}'
    label: Account status
    ai_context:
      synonyms:
      - status
      - account state
      - active or inactive
      - active account
      - inactive account
      - account standing
      examples:
      - How many accounts were active on 6 November 2026?
  custom_extensions:
  - vendor_name: HELIOS
    data: '{"excluded_headers": ["MaturityDate"], "label": "Accounts", "retention": "accepted only", "source_type":
      "logical projection", "subject_area": "accounts_and_products", "worksheet": "Accounts"}'
  ai_context:
    synonyms:
    - account master
    - account list
    - product holdings
    - customer accounts
    - facilities
    - account static data
- name: RelationshipManagers
