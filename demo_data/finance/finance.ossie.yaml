      match on it. Never display the value.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"access": "internal join key; never render source identifier values", "provenance": "batch
        hash", "role": "audit"}'
    label: Source batch
  - name: BusinessDate
    expression:
      dialects:
