- name: STR_Transaction
  source: str_form.STR_Transaction
  description: One transaction per row, read from a suspicious transaction report form. Form field names
    are the column names. The form states the values. The rows are written only after an admin confirms
    a preview, and every cell keeps its source span. This table holds forms, not workbook data. It is
    template-bound physical mapping that works only for this form type.
  primary_key:
  - SourceRevision
  - TransactionSeq
  fields:
  - name: SourceRevision
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SourceRevision
    description: SHA-256 identity of the form file this row was read from. It is provenance, not a business
      attribute. It is supplied by the system, not stated in the form. Never display the value.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"concept": "suspicious_transaction", "provenance": "system: SHA-256 of the form file", "role":
        "audit"}'
    label: Source revision
  - name: TransactionSeq
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: TransactionSeq
    description: Position of the transaction in the form's repeating Transaction group, counted from 1.
      The system supplies it. It is not a transaction reference stated by the institution.
    datatype: Integer
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"concept": "suspicious_transaction", "provenance": "system: position of the Transaction
        group", "role": "identifier"}'
    label: Transaction position
  - name: AccountNo
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AccountNo
    description: Account reference the form states for this transaction. It is valid only inside the form.
      It does not link to a workbook account number. Never display the value.
    datatype: String
    dimension:
      is_time: false
    custom_extensions:
    - vendor_name: HELIOS
      data: '{"concept": "suspicious_transaction", "provenance": "form field name", "role": "identifier"}'
    label: Form account reference
  - name: IsActualTransaction
